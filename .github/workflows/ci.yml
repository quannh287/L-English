name: CI

on:
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - youtube-structure-collector/CHANGELOG.md
      - youtube-structure-collector/manifest.json
      - youtube-structure-collector/package.json
      - youtube-structure-collector/package-lock.json
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-structure-collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: youtube-structure-collector/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-structure-collector
          path: youtube-structure-collector/dist/*.zip
          if-no-files-found: error
