name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          skip-github-pull-request: true

  publish-extension:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-extension.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
      commit_sha: ${{ needs.release.outputs.release_sha }}
    secrets: inherit

  prepare-next-release:
    needs: [release, publish-extension]
    if: >-
      always() &&
      needs.release.result == 'success' &&
      (needs.publish-extension.result == 'success' || needs.publish-extension.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-pr
        with:
          skip-github-release: true

      - name: Request review from repository owner
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ fromJSON(steps.release-pr.outputs.prs)[0].number }}
        run: gh pr edit "$PR_NUMBER" --add-reviewer "$GITHUB_REPOSITORY_OWNER"
